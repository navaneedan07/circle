# Circle — download page.
#
# Circle itself is a desktop application. This site exists only to explain it
# and hand over the file: there is no server here, no database, no Python, and
# nothing private. The app and your archive stay on your own machine.
#
# Deploy:
#   1. Render > New > Blueprint. It reads this file from the repo root.
#   2. Upload the built executable to site/downloads/ (see BUILDING.md);
#      the button in site/index.html points at that filename.
#
# Note the filename is versioned in two places on purpose: the download link
# and the "about 105 MB" line. Bump both when cutting a release, so a cached
# page can never offer a stale binary under a fresh name.

services:
  - type: web
    name: circle
    # Static sites use runtime: static (not node) and have no compute plan or
    # health check; those fields belong to long-running web services.
    runtime: static

    # There is no package.json at the repo root, so nothing needs building:
    # site/ is committed HTML.
    buildCommand: ""

    staticPublishPath: ./site

    envVars:
      - key: NODE_VERSION
        value: "22"

    headers:
      # The executable is replaced on every release, and a cached copy would
      # silently be an old version. The filename is versioned too, so an
      # immutable cache would be wrong here.
      - path: /downloads/*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /index.html
        name: Cache-Control
        value: no-cache
      # A download should never be sniffed as something executable by a proxy.
      - path: /downloads/*
        name: X-Content-Type-Options
        value: nosniff