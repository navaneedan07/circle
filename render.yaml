# Circle — public site.
#
# Circle itself is a desktop application. This site has no server, no database
# and nothing private; the app and the reader's archive stay on their machine.
#
# What it serves:
#   site/  — a committed static download page. No build step, no JavaScript,
#            nothing that can fail at deploy time, and no interface to keep in
#            sync with a second copy.
#
# Deploy:
#   1. Stage the built executable: backend/scripts/publish_release.py
#      It checks the file against the 100 MB host limit and the page copy, then
#      prints the git add to run (site/downloads/ is gitignored).
#   2. Reapply this blueprint in the Render dashboard, then push.
#      Blueprints are not re-read on every push -- this step is the reason a
#      site can keep serving the previous configuration after a commit.
#
# The interface is not deployed here. The application serves its own UI from
# the same local process that holds the archive; an off-machine copy of that UI
# would have no backend behind it.

services:
  - type: web
    name: circle
    # Static sites use runtime: static (not node) and have no compute plan or
    # health check; those fields belong to long-running web services.
    runtime: static

    # There is no package.json at the repo root and nothing to compile:
    # site/ is committed HTML.
    buildCommand: ""

    staticPublishPath: ./site

    envVars:
      - key: NODE_VERSION
        value: "22"

    headers:
      # The executable is replaced on every release, and a cached copy would
      # silently be an old version. The filename is versioned too, so an
      # immutable cache would be wrong here.
      - path: /downloads/*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /index.html
        name: Cache-Control
        value: no-cache
      # A download should never be sniffed as something executable by a proxy.
      - path: /downloads/*
        name: X-Content-Type-Options
        value: nosniff